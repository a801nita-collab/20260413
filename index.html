<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>水底世界作業展覽</title>
    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #001a33;
            font-family: sans-serif;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #display-area {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 15, 30, 0.98);
            border: none;
            border-radius: 0;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            z-index: 10;
            display: none; /* 初始隱藏 */
            flex-direction: column;
            backdrop-filter: blur(8px);
            box-sizing: border-box;
        }
        #close-btn {
            background: #004d80;
            color: white;
            border: none;
            padding: 15px 25px;
            cursor: pointer;
            font-size: 16px;
            text-align: right;
            border-radius: 0;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="display-area">
        <button id="close-btn" onclick="document.getElementById('display-area').style.display='none'">✕ 關閉預覽</button>
        <iframe id="work-iframe" src="about:blank"></iframe>
    </div>
    <script src="sketch.js"></script>
</body>
</html>
